services:
  app:
    build: .
    expose:
      - "8787"
    environment:
      FOODPLAN_SUPERUSER_EMAIL: ${FOODPLAN_SUPERUSER_EMAIL:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      FOODPLAN_LEGACY_OWNER_EMAIL: ${FOODPLAN_LEGACY_OWNER_EMAIL:-}
      FOODPLAN_PUBLIC_URL: https://${FOODPLAN_HOST:?Stel FOODPLAN_HOST in}
      FOODPLAN_HOUSEHOLD_NAME: ${FOODPLAN_HOUSEHOLD_NAME:-}
      FOODPLAN_MEMBER_NAMES: ${FOODPLAN_MEMBER_NAMES:-}
      DEPLOY_WEBHOOK_SECRET: ${DEPLOY_WEBHOOK_SECRET:-}
      DEPLOY_SIGNAL_FILE: /run/foodplan-deploy/pending
      VIRTUAL_HOST: ${FOODPLAN_HOST:?Stel FOODPLAN_HOST in}
      VIRTUAL_PORT: "8787"
      LETSENCRYPT_HOST: ${FOODPLAN_HOST:?Stel FOODPLAN_HOST in}
      LETSENCRYPT_EMAIL: ${ACME_CONTACT_EMAIL:?Stel ACME_CONTACT_EMAIL in}
      ACME_HOST: ${FOODPLAN_HOST:?Stel FOODPLAN_HOST in}
      ACME_EMAIL: ${ACME_CONTACT_EMAIL:?Stel ACME_CONTACT_EMAIL in}
    volumes:
      - meals:/app/data
      - ./.deploy:/run/foodplan-deploy
    networks:
      nginx-proxy:
        aliases:
          - foodplan-backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  meals:

networks:
  nginx-proxy:
    external: true
